[package]
name = "ibridge-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "ibridge_core"
crate-type = ["staticlib"]

[dependencies]
base64 = "0.22.1"
futures = "0.3.32"
idevice = { version = "0.1.61", default-features = false, features = ["ring", "afc", "installation_proxy", "remote_pairing", "rsd", "tcp"] }
isideload = { git = "https://github.com/nab138/isideload", rev = "f6a4d5dba717d72fc2af63eaba26b27ba44116be", package = "isideload", default-features = false, features = ["install", "tokio-mt"] }
rootcause = "0.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.49", features = ["rt-multi-thread", "time", "net", "sync"] }
