name: iBridgeMobile
options:
  bundleIdPrefix: com.dannybaanks.ibridge
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  iBridgeMobile:
    type: application
    platform: iOS
    sources:
      - path: iBridgeMobile
    info:
      path: iBridgeMobile/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dannybaanks.ibridge.mobile
        PRODUCT_NAME: iBridge
        SWIFT_OBJC_BRIDGING_HEADER: iBridgeMobile/BridgingHeader.h
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/build"
        OTHER_LDFLAGS: "$(inherited) -libridge_core -framework Security -framework SystemConfiguration"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
